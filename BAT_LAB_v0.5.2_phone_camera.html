<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAT LAB v0.5.2｜スマホカメラ</title><style>*{box-sizing:border-box}body{margin:0;background:#081a2b;color:#eaf8ff;font:14px system-ui}main{max-width:760px;margin:auto;padding:12px}h2{font-size:18px;margin:6px 0 12px}button{background:#126d96;border:1px solid #92d6e8;border-radius:8px;color:white;padding:11px;margin:3px}textarea{width:100%;height:70px;background:#122f43;color:white;border:1px solid #658da0;border-radius:7px;font:11px monospace}video{width:100%;max-height:35vh;object-fit:contain;background:black;border-radius:10px}section{border:1px solid #54778c;border-radius:9px;padding:10px;margin:8px 0}.small{font-size:12px;color:#b6d3df}#log{font:11px monospace;white-space:pre-wrap;max-height:110px;overflow:auto}</style></head><body><main><h2>BAT LAB v0.5.2｜スマホ外部カメラ</h2><section><b>v0.5.2 自動接続</b><div id="easy-state">QRから開くと自動接続します</div><button id="easy-retry">再接続</button><p class="small">タブレットに表示されたQRをスマホで読み取って開いてください。インターネットが必要です。</p></section><section><b>① タブレットの接続コードを貼り付け</b><textarea id="offer" placeholder="タブレットの接続コード"></textarea><button id="create">② 応答コードを生成</button><p class="small">生成後、下のコードをコピーしてタブレット側に貼り付けます。</p><textarea id="answer" readonly placeholder="スマホの応答コード"></textarea><button id="copy">応答コードをコピー</button><div id="state">未接続</div></section><section><b>③ スマホカメラ</b><div><button id="camera">カメラ起動</button><button id="stop">カメラ停止</button><button id="manual">検出テスト送信</button></div><video id="preview" autoplay muted playsinline></video><p class="small">動き検出は試験用のフレーム差分方式です。バットのインパクト時刻を確定するものではありません。</p><label><input id="detect" type="checkbox" checked> 動きの変化を検出して送信（暫定）</label><div id="metrics" class="small">カメラ停止中</div></section><section><b>タブレットの計測状態：</b><span id="trial">待機中</span></section><section><b>通信・同期イベント</b><div id="log">イベント待機中</div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let pc=null,dc=null,stream=null,raf=null,prev=null,lastMotion=0,frameCount=0,lastFps=performance.now(),fps=0;const cv=document.createElement('canvas');cv.width=64;cv.height=48;const ctx=cv.getContext('2d',{willReadFrequently:true});function log(s){$('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent.slice(0,1200)}function send(o){if(dc?.readyState==='open')dc.send(JSON.stringify(o))}function attach(ch){dc=ch;dc.onopen=()=>{$('state').textContent='接続成功';log('接続成功');send({type:'hello',role:'phone',camera:'frame-difference experimental'})};dc.onclose=()=>{$('state').textContent='切断';log('切断')};dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ping'){const t1=performance.now();const t2=performance.now();send({type:'pong',id:m.id,t0:m.t0,t1,t2})}else if(m.type==='marker'){log('タブレット計測 '+m.kind);$('trial').textContent=m.kind==='start'?'計測中':'停止中'}}}window.BAT52_attach=attach;window.BAT52_log=log;async function waitIce(p){if(p.iceGatheringState==='complete')return;await new Promise(resolve=>{const t=setTimeout(resolve,12000);p.addEventListener('icegatheringstatechange',function f(){if(p.iceGatheringState==='complete'){clearTimeout(t);p.removeEventListener('icegatheringstatechange',f);resolve()}})})}$('create').onclick=async()=>{try{pc?.close();pc=new RTCPeerConnection({iceServers:[]});pc.ondatachannel=e=>attach(e.channel);pc.onconnectionstatechange=()=>{$('state').textContent='接続：'+pc.connectionState};await pc.setRemoteDescription(JSON.parse($('offer').value));await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);$('answer').value=JSON.stringify(pc.localDescription);log('応答コード生成完了')}catch(e){alert('生成失敗：'+e.message)}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('answer').value);alert('コピーしました')}catch(e){$('answer').select();alert('手動でコピーしてください')}};function analyze(t){if(!stream)return;ctx.drawImage($('preview'),0,0,64,48);const data=ctx.getImageData(0,0,64,48).data;let now=performance.now();frameCount++;if(now-lastFps>=1000){fps=frameCount*1000/(now-lastFps);frameCount=0;lastFps=now;$('metrics').textContent='解析FPS：'+fps.toFixed(1)+' / 通信：'+(dc?.readyState||'未接続')}if(prev){let diff=0;for(let i=0;i<data.length;i+=16)diff+=Math.abs(data[i]-prev[i]);diff/=data.length/16;if(diff>18&&now-lastMotion>450&&$('detect').checked){lastMotion=now;send({type:'camera',mono:now,kind:'frame-motion',confidence:Math.min(1,diff/80).toFixed(2),fps:fps.toFixed(1)});log('映像変化 '+diff.toFixed(1)+'（インパクト判定ではありません）')}}prev=new Uint8ClampedArray(data);raf=setTimeout(analyze,70)}$('camera').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPSまたは安全なページで開いてください');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480},frameRate:{ideal:60}},audio:false});$('preview').srcObject=stream;await $('preview').play();prev=null;analyze();log('カメラ起動')}catch(e){alert('カメラ起動失敗：'+e.message)}};$('stop').onclick=()=>{stream?.getTracks().forEach(x=>x.stop());stream=null;clearTimeout(raf);$('preview').srcObject=null;log('カメラ停止')};$('manual').onclick=()=>{send({type:'camera',mono:performance.now(),kind:'manual-test',confidence:1,fps:fps.toFixed(1)});log('手動テスト送信')};})();</script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let peer=null,conn=null;const room=new URLSearchParams(location.hash.replace(/^#/, '')).get('room');function status(s){$('easy-state').textContent=s;window.BAT52_log?.(s)}
function load(){return new Promise((ok,no)=>{if(window.Peer)return ok();const el=document.createElement('script');el.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';el.onload=ok;el.onerror=()=>no(Error('PeerJSを読み込めません'));document.head.appendChild(el)})}
async function connect(){if(!room){status('タブレットのQRから開いてください');return}try{status('接続サービスに接続中…');conn?.close();peer?.destroy();await load();peer=new Peer({debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{status('タブレットへ接続中…');conn=peer.connect(room,{reliable:true});const ch={readyState:'connecting',send:x=>conn.send(x),onopen:null,onclose:null,onmessage:null};window.BAT52_attach(ch);conn.on('open',()=>{ch.readyState='open';ch.onopen?.();status('自動接続成功')});conn.on('data',x=>ch.onmessage?.({data:typeof x==='string'?x:JSON.stringify(x)}));conn.on('close',()=>{ch.readyState='closed';ch.onclose?.();status('切断：再接続を押してください')});conn.on('error',e=>status('接続エラー '+e.message))});peer.on('error',e=>status('接続サービスエラー '+(e.type||e.message)));peer.on('disconnected',()=>{if(!peer.destroyed)peer.reconnect()})}catch(e){status('開始失敗：'+e.message)}}
$('easy-retry').onclick=connect;if(room)connect();
})();</script></body></html>
